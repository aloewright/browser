#
# Rotation for the LaunchAgent log. Copy to /etc/newsyslog.d/ko-agentd.conf
# and replace USERNAME. N = no signal: launchd keeps writing to the rotated
# file until the agent restarts, so newsyslog can't hand it a new log. After a
# rotation, run: launchctl kickstart -k gui/$(id -u)/dev.k-o.agentd
# logfilename                                   [owner:group]    mode count size when  flags
/Users/USERNAME/Library/Logs/K-O/agentd.log     USERNAME:staff   600  5     5120 *     NJ
